name: Earthquakes
options:
  bundleIdPrefix: com.muttniks
  deploymentTarget:
    iOS: "27.0"
packages:
  Muttniks:
    path: ../
targets:
  MuttniksDemo:
    type: application
    supportedDestinations: [iOS]
    sources: [Sources]
    dependencies:
      - package: Muttniks
        product: Muttniks
      - package: Muttniks
        product: MuttniksUIKit
      - package: Muttniks
        product: MuttniksJSON
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Earthquakes
        UILaunchScreen: {}
