[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/"]

[profile.ci]
fuzz.runs = 10000
invariant.runs = 1000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false
